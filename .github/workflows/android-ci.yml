name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble debug APK fallback
        run: gradle :app:assembleDebug

      - name: Upload debug APK fallback
        uses: actions/upload-artifact@v4
        with:
          name: GOLDEN-SHINE-MARBLE-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Detect release signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Only the debug-signed APK will be produced."
          fi

      - name: Decode company keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/golden-shine-release.jks"

      - name: Assemble company-signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/golden-shine-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload company-signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GOLDEN-SHINE-MARBLE-SIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish debug APK fallback
        if: steps.signing.outputs.available != 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.${{ github.run_number }}
          name: GOLDEN SHINE MARBLE Android v1.1.${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish company-signed release APK
        if: steps.signing.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.${{ github.run_number }}
          name: GOLDEN SHINE MARBLE Android v1.1.${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
