name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOLDEN-SHINE-MARBLE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release for manual runs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.${{ github.run_number }}
          name: GOLDEN SHINE MARBLE Android v1.1.${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
